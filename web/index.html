<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClearCut — ブラウザ内AI処理</title>
<style>
  :root {
    color-scheme: light dark;
    /* primitive tokens -- theme-independent raw values.
       Accent hue was moved from indigo (~#4f46e5, Tailwind indigo-600 --
       called out in review as "the most over-used AI-tool color") to a
       cooler, more distinct blue (~215°). Kept >=20° of hue separation from
       accent-cyan (GPU badge), success (green), warn (gold) and danger (red)
       so none of them get confused with the primary accent at a glance. */
    --p-ink-950:#0a0b0f; --p-ink-900:#12141a; --p-ink-800:#1a1d24;
    --p-paper-0:#ffffff; --p-paper-50:#f7f8fa; --p-paper-100:#eef0f3;
    --p-brand-600:#2c5fc4; --p-brand-500:#3f72d6; --p-brand-400:#6ba3f2;
    --p-cyan-600:#0891b2; --p-cyan-500:#22d3ee;
    --p-good-600:#1a9c6c; --p-good-500:#2fd68e;
    --p-gold-600:#c9821f; --p-gold-500:#f0a94e;
    --p-bad-600:#d1403f; --p-bad-500:#ef5c5c;

    /* semantic tokens -- light theme (default) */
    --bg:var(--p-paper-50); --surface:var(--p-paper-0); --surface-2:var(--p-paper-100);
    --border:rgba(10,11,15,.12);
    /* text-mute measured at ~4.55:1 against the page background in the
       previous value (#6b7280) -- technically AA-passing but with almost no
       margin, and the semi-transparent status-strip backdrop can push the
       effective contrast lower. Darkened for headroom (~5.6:1 measured). */
    --text:#1a1d24; --text-mute:#5b6472; --text-heading:#0a0b0f;
    --accent:var(--p-brand-600); --accent-cyan:var(--p-cyan-600);
    --success:var(--p-good-600); --warn:var(--p-gold-600); --danger:var(--p-bad-600);
    /* Text color placed ON TOP of --accent. Light accent (#2c5fc4) is dark
       enough for white text (measured ~5.9:1). */
    --on-accent:#ffffff;

    --radius-s:8px; --radius-m:10px; --radius-l:16px; --radius-full:9999px;
    --ease-out:cubic-bezier(0.16,1,0.3,1);
    --dur-fast:150ms; --dur-base:320ms;
    --shadow-sm:0 2px 8px rgba(0,0,0,.06); --shadow-md:0 8px 24px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:var(--p-ink-950); --surface:var(--p-ink-900); --surface-2:var(--p-ink-800);
      --border:rgba(255,255,255,.09);
      --text:#eef1f6; --text-mute:#8a93a6; --text-heading:#f7f8fa;
      --accent:var(--p-brand-400); --accent-cyan:var(--p-cyan-500);
      --success:var(--p-good-500); --warn:var(--p-gold-500); --danger:var(--p-bad-500);
      /* Dark-mode accent (#6ba3f2) is light -- white text on it measured
         only ~3.05:1 (fails WCAG AA's 4.5:1). Dark text measures ~7.6:1. */
      --on-accent:var(--p-ink-950);
      --shadow-sm:0 2px 8px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  /* Many fixed-DOM blocks below (.preview-pair, .boot-loader, .stepper,
     .error-banner, .confirm-block, .progress-block, .done-panel,
     .download-row) set their own `display: flex` at author-stylesheet
     normal priority, which -- per the CSS cascade -- outranks the UA
     stylesheet's `[hidden] { display: none }` (also normal priority, but
     user-agent origin loses to author origin at equal specificity). Without
     this override, toggling the `hidden` attribute from ui.mjs would leave
     those elements visually flexed open. */
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .shell { max-width: 920px; margin: 0 auto; padding: 0 1rem 3rem; min-height: 100vh; display: flex; flex-direction: column; }

  /* --- Status strip (always visible, sticky) --- */
  .status-strip {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.9rem 0.25rem;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  /* Wordmark only, no icon -- an AI-generated mascot/icon was tried and
     rejected as "dated-looking", and a second generic geometric glyph would
     likely read the same way. Weight+color split (Clear bold+accent,
     Cut lighter+heading color) does the identity work instead: it
     turns a plain label into a name without adding a graphic element. */
  /* flex-shrink:0 -- the name itself must never truncate; .status-live's
     min-width:0 is what gives way first if the strip runs out of room
     (e.g. on narrow viewports, now that the wordmark is longer than
     the old "背景除去"). */
  .brand { display: flex; align-items: center; margin-right: 0.4rem; white-space: nowrap; flex-shrink: 0; }
  .brand-name { font-size: 1.05rem; letter-spacing: -0.02em; }
  .brand-name .brand-clear { font-weight: 800; color: var(--accent); }
  .brand-name .brand-cut { font-weight: 500; color: var(--text-heading); }
  .status-live { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
  .sb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-mute); flex-shrink: 0; }
  .sb-dot[data-tone="busy"] { background: var(--accent); animation: sbPulse 1.4s ease-in-out infinite; }
  .sb-dot[data-tone="good"] { background: var(--success); }
  .sb-dot[data-tone="danger"] { background: var(--danger); }
  @keyframes sbPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .sb-label { font-size: 0.86rem; color: var(--text-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-spacer { flex: 1; }
  .sb-badge {
    position: relative;
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--surface-2); color: var(--text-mute);
    border: 1px solid var(--border); border-radius: var(--radius-full);
    padding: 0.32rem 0.7rem; font-size: 0.78rem; cursor: pointer; min-height: unset;
    font-weight: 500;
  }
  /* Expand the hit area to ~44px without growing the visible pill (same
     trick as 11_Explorebot's settings-gear button). */
  .sb-badge::before { content: ''; position: absolute; inset: -10px; }
  .sb-badge:hover:not(:disabled) { color: var(--text); filter: none; transform: none; box-shadow: none; }
  .sb-badge svg { width: 14px; height: 14px; }
  /* Visual affordance that this pill is clickable (opens the CPU/GPU
     toggle popover) -- without it, the badge reads as a plain status
     indicator. Descendant-selector specificity (0,2,0) needed to beat the
     generic ".sb-badge svg" rule (0,1,1) above. */
  .sb-badge .sb-badge-chevron { width: 9px; height: 9px; opacity: 0.55; }
  /* GPU (WebGPU) actually in effect gets the cyan identity color -- CPU/WASM
     stays the neutral gray. See worker.mjs's createSessionWithFallback for
     what "actually in effect" means (a verified dummy run, not just intent). */
  .sb-badge[data-tone="gpu"] {
    color: var(--accent-cyan);
    border-color: color-mix(in srgb, var(--accent-cyan) 45%, var(--border));
  }
  /* Reused for STAGE.VIDEO_CONFIRM's fps picker (formerly the env popover's
     per-model CPU/GPU toggle, since removed -- same pill-toggle look). */
  .fps-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
  .fps-label { font-size: 0.82rem; color: var(--text-mute); }
  .fps-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius-full); overflow: hidden; flex-shrink: 0; }
  .fps-toggle button {
    min-height: unset; border-radius: 0; padding: 0.28rem 0.65rem; font-size: 0.72rem; font-weight: 600;
    background: var(--surface-2); color: var(--text-mute); box-shadow: none; transform: none;
  }
  .fps-toggle button:hover:not(:disabled) { filter: none; transform: none; box-shadow: none; color: var(--text); }
  .fps-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* --- Main stage --- */
  .stage-wrap { flex: 1; display: flex; flex-direction: column; gap: 0.85rem; padding-top: 1.4rem; }
  .stage {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l);
    padding: 1.5rem; min-height: 260px; display: flex; flex-direction: column;
    box-shadow: var(--shadow-sm);
  }

  .drop-zone {
    /* Matches .placeholder-box's aspect-ratio (see renderStage()'s IDLE
       branch) so the "変換前"/"変換後" columns are the same height from the
       very first paint, instead of the drop zone sizing to its own content
       (~200px) while the placeholder next to it sizes to 4:3. */
    aspect-ratio: 4 / 3; min-height: 200px;
    border: 2px dashed var(--border); border-radius: var(--radius-m);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.7rem; padding: 2rem 1rem; text-align: center; color: var(--text-mute); cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .drop-zone:hover, .drop-zone:focus-visible { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .drop-zone[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
  /* Drag-over feedback lives on #fig-before (the whole column), not
     .drop-zone itself -- dropping a replacement file is accepted while
     #fig-before shows the result canvas too (STAGE.IMAGE_DONE/VIDEO_DONE),
     so the highlight has to work regardless of which child is visible. */
  #fig-before.drop-target-active {
    outline: 2px solid var(--accent); outline-offset: 4px; border-radius: var(--radius-m);
    background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  /* .icon is an inline <span> -- width/height on the span itself is a no-op,
     the child svg (viewBox-only, no intrinsic size) is what actually needs
     sizing, same bug class as the button-icon fix above. */
  .drop-zone .icon svg { width: 36px; height: 36px; color: var(--text-mute); }
  .drop-zone strong { color: var(--text); font-weight: 600; font-size: 0.92rem; }
  .drop-zone small { font-size: 0.74rem; opacity: 0.75; }

  .preview-pair { display: flex; gap: 1rem; flex-wrap: wrap; }
  .preview-pair figure { margin: 0; flex: 1 1 260px; display: flex; flex-direction: column; }
  .preview-pair canvas, .preview-pair img { max-width: 100%; border-radius: var(--radius-m); border: 1px solid var(--border); display: block; }
  .preview-pair figcaption { margin-top: 0.4rem; font-size: 0.8rem; color: var(--text-mute); }
  .placeholder-box { flex: 1; min-height: 200px; width: 100%; background: var(--surface-2); border: 1px dashed var(--border); border-radius: var(--radius-m); }

  /* --- Boot loader (STAGE.BOOTING) --- */
  .boot-loader { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; }
  .boot-ring-wrap { width: 84px; height: 84px; position: relative; }
  .boot-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
  .boot-ring-outer { border-top-color: var(--accent); border-right-color: color-mix(in srgb, var(--accent) 15%, transparent); animation: bootSpin 1.5s linear infinite; }
  .boot-ring-mid { inset: 11px; border-bottom-color: var(--accent-cyan); border-left-color: color-mix(in srgb, var(--accent-cyan) 15%, transparent); animation: bootSpin 1s linear infinite reverse; }
  .boot-ring-inner { inset: 24px; border-top-color: color-mix(in srgb, var(--accent) 45%, transparent); animation: bootSpin 0.7s linear infinite; }
  @keyframes bootSpin { to { transform: rotate(360deg); } }
  .boot-scan-track { width: 200px; height: 1px; background: var(--border); position: relative; overflow: hidden; border-radius: 1px; }
  .boot-scan-beam { position: absolute; top: 0; left: -50%; width: 35%; height: 100%; background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent); animation: bootScan 2.2s ease-in-out infinite; }
  @keyframes bootScan { 0% { left: -50%; } 100% { left: 115%; } }
  .boot-status { font-size: 0.78rem; color: var(--text-mute); letter-spacing: 0.02em; margin: 0; }
  .boot-progress-track { width: 200px; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .boot-progress-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-cyan) 100%); transition: width 0.4s ease; }
  .checker {
    background-image:
      linear-gradient(45deg, rgba(128,128,128,.14) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(128,128,128,.14) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(128,128,128,.14) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(128,128,128,.14) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  }
  .result-flash { animation: resultFlash 700ms var(--ease-out); }
  @keyframes resultFlash {
    0% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 45%, transparent); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  .stepper { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.1rem; font-size: 0.82rem; color: var(--text-mute); }
  .stepper .step { display: flex; align-items: center; gap: 0.35rem; }
  .stepper .step .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .stepper .step[data-state="active"] { color: var(--text); font-weight: 600; }
  .stepper .step[data-state="active"] .dot { background: var(--accent); animation: sbPulse 1.2s ease-in-out infinite; }
  .stepper .step[data-state="done"] .dot { background: var(--success); }
  .stepper .sep { width: 16px; height: 1px; background: var(--border); }
  .frame-counter { font-size: 0.78rem; color: var(--text-mute); margin-top: 0.5rem; }

  /* --- Dock: action area below the stage --- */
  .dock { display: flex; flex-direction: column; gap: 0.75rem; }
  .progress-block { display: flex; flex-direction: column; gap: 0.4rem; }
  .bar-track { background: var(--surface-2); border-radius: var(--radius-full); height: 8px; overflow: hidden; position: relative; }
  .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width var(--dur-base) var(--ease-out); border-radius: inherit; position: relative; overflow: hidden; }
  .bar-fill.busy::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    animation: barSheen 1.6s linear infinite;
  }
  @keyframes barSheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  /* STAGE.VIDEO_EXPORTING has no known total (ZIP/GIF encoding isn't tracked
     frame-by-frame), so a bar pinned at width:100% used to read as "already
     done" while the label still said "exporting". A sliding indeterminate
     fill makes "still working, no ETA" visually distinct from "complete". */
  .bar-fill.indeterminate { width: 100%; background: transparent; }
  .bar-fill.indeterminate::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
    background: var(--accent); border-radius: inherit;
    animation: barIndeterminate 1.3s ease-in-out infinite;
  }
  @keyframes barIndeterminate { 0% { left: -40%; } 100% { left: 100%; } }
  .progress-text { font-size: 0.82rem; color: var(--text-mute); }

  /* --- Done panel (STAGE.IMAGE_DONE / VIDEO_DONE) --- */
  .done-panel {
    background: color-mix(in srgb, var(--success) 6%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--success) 25%, var(--border));
    border-radius: var(--radius-l); padding: 1.1rem 1.25rem;
    display: flex; flex-direction: column; gap: 0.9rem;
  }
  .done-panel.warn {
    background: color-mix(in srgb, var(--warn) 8%, var(--surface));
    border-color: color-mix(in srgb, var(--warn) 30%, var(--border));
  }
  .done-headline { display: flex; align-items: flex-start; gap: 0.7rem; }
  .done-icon {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success);
  }
  .done-panel.warn .done-icon { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .done-icon svg { width: 18px; height: 18px; }
  .done-headline strong { font-size: 1.02rem; color: var(--text-heading); }
  .done-sub { margin: 0.2rem 0 0; font-size: 0.83rem; color: var(--text-mute); }
  .download-row { display: flex; flex-direction: column; gap: 0.6rem; }
  .download-row a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; width: 100%; box-shadow: var(--shadow-sm); }
  /* Every icon svg used inside a button/link ships with only a viewBox (no
     width/height -- see icons.mjs), so the UA default intrinsic size
     (300x150 in Chrome/Firefox) applies unless CSS overrides it here. Missing
     this rule is what made the download button balloon to ~300px tall.
     :where() keeps this at zero specificity so the more specific per-context
     rules (.done-icon svg, .confirm-note svg, .error-banner svg, .sb-badge
     svg) still win regardless of source order. */
  :where(button, .btn) svg { width: 1.1em; height: 1.1em; flex-shrink: 0; }
  .btn-link {
    background: transparent; color: var(--text-mute); border: none; min-height: unset;
    padding: 0.3rem 0; font-size: 0.85rem; font-weight: 500; text-decoration: underline;
    align-self: center; box-shadow: none;
  }
  .btn-link:hover:not(:disabled) { color: var(--text); filter: none; transform: none; box-shadow: none; }
  .error-banner {
    display: flex; align-items: flex-start; gap: 0.6rem;
    background: color-mix(in srgb, var(--danger) 10%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border));
    color: var(--text); border-radius: var(--radius-m); padding: 0.85rem 1rem; font-size: 0.86rem;
  }
  .error-banner svg { width: 18px; height: 18px; color: var(--danger); flex-shrink: 0; margin-top: 1px; }
  .error-banner .actions { margin-top: 0.6rem; }

  .confirm-block { display: flex; flex-direction: column; gap: 0.6rem; }
  .confirm-estimate { text-align: center; font-size: 1.4rem; font-weight: 700; color: var(--text-heading); margin: 0.2rem 0 0.4rem; }
  .confirm-estimate .mono { color: var(--accent); }
  .confirm-estimate-label { display: block; font-size: 0.72rem; font-weight: 500; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.15rem; }
  .confirm-note { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-mute); margin: 0; }
  .confirm-note svg { width: 16px; height: 16px; flex-shrink: 0; }
  .confirm-note.soft { color: var(--warn); }
  .confirm-note.hard { color: var(--danger); }
  .confirm-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .cancel-row { display: flex; }
  .cancel-row button { padding: 0.4rem 1rem; min-height: unset; font-size: 0.85rem; }

  /* --- Buttons --- */
  button, .btn {
    font: inherit; border: none; border-radius: var(--radius-m);
    padding: 0.7rem 1.4rem; min-height: 48px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--on-accent);
    transition: filter var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  button:hover:not(:disabled):not(.is-disabled) { filter: brightness(1.08); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  button:active:not(:disabled):not(.is-disabled) { filter: brightness(0.95); transform: translateY(0); }
  button:disabled { opacity: 0.5; cursor: default; }
  /* Used instead of the disabled attribute where focus must survive the
     click (the video-cancel button) -- a real `disabled` element can't hold
     focus, so the browser would drop it to <body> the instant the user
     cancels. pointer-events:none blocks mouse clicks; the click handler
     itself still no-ops on a second Enter/Space press via cancelRequested. */
  button.is-disabled, .btn.is-disabled { opacity: 0.5; pointer-events: none; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-block { width: 100%; }
  button:focus-visible, .drop-zone:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .spinner {
    width: 1em; height: 1em; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner, .sb-dot[data-tone="busy"], .stepper .step[data-state="active"] .dot, .bar-fill.busy::after,
    .bar-fill.indeterminate::before, .boot-ring, .boot-scan-beam { animation: none !important; }
    * { transition-duration: 50ms !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="status-strip">
    <span class="brand">
      <span class="brand-name"><span class="brand-clear">Clear</span><span class="brand-cut">Cut</span></span>
    </span>
    <!-- Only this live region announces to screen readers -- scoped to just
         the dot+label so status updates don't also re-announce the env
         badge button's label (previously the whole header was one
         aria-atomic region). -->
    <span class="status-live" role="status" aria-live="polite" aria-atomic="true">
      <span class="sb-dot" id="sb-dot" data-tone="mute"></span>
      <span class="sb-label" id="status">起動中</span>
    </span>
    <span class="sb-spacer"></span>
    <!-- A single global CPU/GPU toggle, not a per-model popover -- only
         "everything CPU" or "everything GPU (as far as it works)" are
         meaningful choices in practice. Click directly toggles, see
         ui.mjs's toggleGlobalExecutionProvider(). -->
    <button class="sb-badge" id="env-badge" type="button" aria-label="クリックしてCPU/GPUを切り替え">
      <span id="env-badge-icon"></span>
      <span id="env-badge-text">--</span>
      <svg class="sb-badge-chevron" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </header>

  <main class="stage-wrap">
    <!-- Fixed DOM for both stage/dock: every element a stage might need
         exists from page load and is only ever shown/hidden or has its
         text/attributes updated -- never created/destroyed on transition.
         See src/ui.mjs's renderStage()/renderDock() for the single place
         that decides which of these are visible per STATE.stage. -->
    <section class="stage" id="stage" aria-label="処理エリア">
      <div class="boot-loader" id="boot-loader" hidden>
        <div class="boot-ring-wrap">
          <div class="boot-ring boot-ring-outer"></div>
          <div class="boot-ring boot-ring-mid"></div>
          <div class="boot-ring boot-ring-inner"></div>
        </div>
        <div class="boot-scan-track"><div class="boot-scan-beam"></div></div>
        <p class="boot-status mono" id="boot-status"></p>
        <div class="boot-progress-track"><div class="boot-progress-bar" id="boot-progress-bar"></div></div>
      </div>

      <div class="stepper" id="stepper" hidden>
        <span class="step" data-phase="detecting" data-state="pending"><span class="dot"></span>検出</span>
        <span class="sep"></span>
        <span class="step" data-phase="matting" data-state="pending"><span class="dot"></span>透過処理</span>
        <span class="sep"></span>
        <span class="step" data-phase="postprocess" data-state="pending"><span class="dot"></span>仕上げ</span>
      </div>

      <div class="preview-pair" id="preview-pair" hidden>
        <figure id="fig-before">
          <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="画像または動画をアップロード" aria-disabled="false">
            <span class="icon" id="drop-icon">
              <svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            </span>
            <strong id="drop-title">画像または動画をドラッグ&ドロップ</strong>
            <small id="drop-sub">送信なし</small>
          </div>
          <canvas id="before-canvas" hidden></canvas>
          <figcaption>変換前</figcaption>
        </figure>
        <figure id="fig-after">
          <div class="placeholder-box" id="after-placeholder"></div>
          <canvas id="after-canvas" class="checker" hidden></canvas>
          <img id="after-gif" class="checker" hidden alt="変換後のアニメーションプレビュー" />
          <figcaption>変換後</figcaption>
        </figure>
      </div>

      <p class="frame-counter mono" id="frame-counter" hidden></p>

      <div class="error-banner" id="error-banner" role="alert" hidden>
        <svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.5 18a1.5 1.5 0 0 0 1.3 2.2h16.4a1.5 1.5 0 0 0 1.3-2.2L13.7 3.9a1.5 1.5 0 0 0-2.6 0z"/></svg>
        <div>
          <div id="error-message"></div>
          <p class="actions" id="error-partial-note" hidden></p>
        </div>
      </div>
    </section>

    <div class="dock" id="dock">
      <button id="primary-btn" type="button" hidden></button>

      <div class="confirm-block" id="confirm-block" hidden>
        <p class="confirm-estimate"><span class="confirm-estimate-label">推定処理時間</span><span class="mono" id="confirm-estimate-text"></span></p>
        <div class="fps-row">
          <span class="fps-label">精度</span>
          <div class="fps-toggle" id="fps-toggle" role="group" aria-label="精度(高いほど時間がかかる)">
            <button type="button" data-fps="5">標準</button>
            <button type="button" data-fps="10">高精度</button>
            <button type="button" data-fps="15">最高精度</button>
          </div>
        </div>
        <p class="confirm-note" id="confirm-note" hidden></p>
        <div class="confirm-actions">
          <button id="confirm-btn" type="button">変換する</button>
          <button id="confirm-cancel-btn" type="button" class="btn-secondary">キャンセル</button>
        </div>
      </div>

      <div class="progress-block" id="progress-block" hidden>
        <div class="bar-track"><div class="bar-fill busy" id="bar-fill"></div></div>
        <p class="progress-text mono" id="progress-text"></p>
        <div class="cancel-row" id="cancel-row" hidden>
          <button id="cancel-btn" type="button" class="btn-secondary">キャンセル</button>
        </div>
      </div>

      <div class="done-panel" id="done-panel" hidden>
        <div class="done-headline">
          <span class="done-icon" id="done-icon"></span>
          <div><strong id="done-title"></strong><p class="done-sub" id="done-sub"></p></div>
        </div>
        <div class="download-row" id="download-row"></div>
      </div>

      <div class="download-row" id="error-download-row" hidden></div>
      <button id="retry-btn" type="button" class="btn-secondary" hidden>やり直す</button>
      <button id="new-file-btn" type="button" class="btn-link" hidden>別のファイルを選ぶ</button>
    </div>
  </main>
</div>
<input id="file-input" type="file" accept="image/*,video/*" style="display:none" />
<script type="module" src="./src/ui.mjs"></script>
</body>
</html>
